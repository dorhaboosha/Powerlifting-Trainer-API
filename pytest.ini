# Pytest configuration for this repository (read automatically when you run ``pytest``).
#
# What lives here:
#   - Registered markers (optional metadata for ``pytest -m`` filtering and linting).
#   - pytest-asyncio defaults so ``async def`` tests run without extra boilerplate.
#
# Typical commands:
#   pytest                    # discover and run all tests
#   pytest Test_App.py -v     # one file, verbose
#   pytest -m asyncio         # only tests marked with @pytest.mark.asyncio (if you use -m)

[pytest]

# Declared markers stop pytest from warning about unknown @pytest.mark.* names (pytest 8+).
# Each line is: marker_name: short description for ``pytest --markers``.
markers =
    asyncio: tests that use ``async def`` and ``await`` (pytest-asyncio)

# Let pytest-asyncio treat async tests as asyncio without forcing ``@pytest.mark.asyncio``
# on every test (still fine to mark explicitly for clarity).
# See: https://pytest-asyncio.readthedocs.io/en/latest/reference/configuration.html
asyncio_mode = auto
